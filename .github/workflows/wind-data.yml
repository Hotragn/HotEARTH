name: wind-data

# GFS cycles run at 00/06/12/18 UTC and are fully published ~3.5-5 h later
# (the f000 analysis we need arrives early in that window). Running at
# HH:25 for 04/10/16/22 UTC puts us ~4h25m after each cycle: late enough
# that the cycle is normally available, early enough that the site stays
# fresh. The :25 offset avoids the top-of-hour GitHub Actions congestion
# where scheduled jobs get delayed or skipped. If a cycle is late, the
# script automatically falls back to the previous cycle, so the run still
# produces valid (slightly older) data instead of failing.
on:
  schedule:
    - cron: "25 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-data
  cancel-in-progress: false

jobs:
  update-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the robust push step below can rebase our data
          # commit onto main if the branch advanced during the run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy

      # The script exits non-zero on any fetch/decode/validation failure and
      # only writes the JSON after validation passes, so a bad upstream cycle
      # fails the job loudly here and nothing below runs (no garbage commits).
      - name: Fetch and process GFS wind field
        run: python scripts/wind/fetch_wind.py

      - name: Stage output for the app
        run: |
          mkdir -p public/data/wind
          cp scripts/wind/output/current.json public/data/wind/current.json

      # Publish to the `data` branch, NOT to main.
      #
      # main is what Vercel deploys, and each push to it stores a whole new
      # deployment. This file changes four times a day, which was 113 of the 171
      # data commits in a typical month and so the largest single consumer of
      # deployment storage on the project, for 550 kB of new numbers a time.
      #
      # A FRESH REPOSITORY EVERY RUN, force-pushed, so the branch holds exactly
      # one parentless commit and its history never grows. Nothing deploys from
      # it. The app reads it over raw.githubusercontent.com, which sends
      # Access-Control-Allow-Origin: *, and falls back to the copy committed in
      # main when that is unreachable.
      #
      # THERE IS DELIBERATELY NO NO-CHANGE CHECK HERE. On main that check earned
      # its keep, because an unchanged commit was still a stored deployment. A
      # force-push to a single-commit branch costs nothing whether the bytes
      # moved or not, so the guard would be complexity buying nothing. The fetch
      # script still declines to rewrite the file when GFS has not moved, which
      # is where that logic belongs.
      #
      # No rebase-and-retry loop either. That existed because main advanced
      # under us between checkout and push; a force-push to a branch no one else
      # writes cannot conflict.
      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          mkdir -p "$staging/wind"
          cp public/data/wind/current.json "$staging/wind/current.json"
          cp .github/data-branch-README.md "$staging/README.md"
          cd "$staging"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "data: wind field mirror

          Force-pushed on every refresh. See README.md on this branch."
          git push -f -q             "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" data
          echo "Published $(git rev-parse HEAD) to the data branch."

