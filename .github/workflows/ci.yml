name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  data-pipeline:
    name: data pipeline smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Light smoke check: the wind fetcher must at least parse and compile.
      # A full fetch runs on a schedule in wind-data.yml, not here.
      # Compile-check EVERY pipeline, not just one.
      #
      # This step used to name scripts/wind/fetch_wind.py alone, from when that
      # was the only one. There are now more than twenty five, each on its own
      # monthly or weekly cron, so a syntax error in any of the others would sit
      # undetected until its schedule came round and then fail in a job nobody
      # is watching. Compiling all of them costs a second.
      - name: Compile-check every data pipeline
        run: |
          set -e
          found=$(find scripts model -name "*.py" -type f | sort)
          if [ -z "$found" ]; then
            echo "::error::no Python pipelines found; the layout changed"
            exit 1
          fi
          echo "$found" | sed "s/^/  /"
          echo "$found" | xargs -r python -m py_compile
          echo "compiled $(echo "$found" | wc -l) files"
